<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1F4A3A">
  <title>{% block title %}Hostel Mess{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="wordmark" href="{{ url_for('home') }}" aria-label="Hostel Mess home">
      <svg class="thali" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <circle cx="16" cy="11" r="4" fill="currentColor"/>
        <circle cx="10.5" cy="19" r="3.2" fill="currentColor" opacity=".55"/>
        <circle cx="21.5" cy="19" r="3.2" fill="currentColor" opacity=".55"/>
      </svg>
      <span>hostel mess</span>
    </a>
    <nav class="nav">{% block nav %}{% endblock %}</nav>
  </header>

  <main id="main" class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="flashes" role="status">
        {% for kind, msg in messages %}
          <p class="flash {{ kind }}">{{ msg }}</p>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
