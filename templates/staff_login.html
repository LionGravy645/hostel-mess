{% extends "base.html" %}
{% block title %}Staff login · Hostel Mess{% endblock %}
{% block nav %}<a href="{{ url_for('home') }}">Student login</a>{% endblock %}
{% block content %}
<section class="entry solo">
  <h1 class="entry-title">Mess counter</h1>
  <p class="lede">For mess staff. Manage the menu, see sales and student credits.</p>
  <form method="post" class="form">
    <label for="password">Staff password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required autofocus>
    <button class="btn primary wide">Open counter</button>
  </form>
</section>
{% endblock %}
